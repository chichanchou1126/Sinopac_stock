<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 我的股票市值儀表板</h1>
    
    <div class="summary">
        總市值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th>股票名稱</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="5" class="loading">正在精準比對官方數據庫...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================================
    // ⚙️ 【在此處修改你實際持有的台股代號與股數】
    // ==========================================================
    const myStocks = {
        "2330": 1000,   // 台積電
        "2454": 500,    // 聯發科
        "0050": 2000,   // 元大台灣50
        "00751B": 5000  // 元大公司債
    };
    // ==========================================================

    const stockNames = {
        "2330": "台積電",
        "2454": "聯發科",
        "0050": "元大台灣50",
        "00751B": "元大AAA至A級公司債"
    };

    async function fetchStockData() {
        const tableBody = document.getElementById('stock-table-body');
        let totalValue = 0;
        let htmlContent = '';
        
        // 將使用者定義的代號全部轉為大寫並清除空白
        const targetIds = Object.keys(myStocks).map(id => id.trim().toUpperCase());
        const globalPriceMap = {};

        try {
            // 【1. 撈取上市股票與部分ETF行情】
            try {
                const twseRes = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL');
                if (twseRes.ok) {
                    const twseData = await twseRes.json();
                    twseData.forEach(item => {
                        // 相容 Code 或 StockId 欄位，並強制去空白
                        const rawCode = item.Code || item.StockId || "";
                        const cleanCode = rawCode.trim().toUpperCase();
                        if (targetIds.includes(cleanCode)) {
                            globalPriceMap[cleanCode] = parseFloat(item.Price) || 0;
                        }
                    });
                }
            } catch (e) { console.warn("上市數據撈取/解析有誤", e); }

            // 【2. 撈取上櫃債券 ETF 行情 (針對 00751B 等)】
            try {
                const tpexRes = await fetch('https://openapi.tpex.org.tw/v1/tpex_main_etf_daily_QUOT');
                if (tpexRes.ok) {
                    const tpexData = await tpexRes.json();
                    tpexData.forEach(item => {
                        const rawCode = item.No || item.Code || "";
                        const cleanCode = rawCode.trim().toUpperCase();
                        if (targetIds.includes(cleanCode)) {
                            // 櫃買中心的價格欄位可能是 Price 或 Close
                            const rawPrice = item.Price || item.Close || "0";
                            globalPriceMap[cleanCode] = parseFloat(rawPrice.replace(/,/g, '')) || 0;
                        }
                    });
                }
            } catch (e) { console.warn("上櫃債券數據撈取有誤", e); }

            // 【3. 撈取上櫃一般個股行情備援】
            try {
                const tpexRes2 = await fetch('https://openapi.tpex.org.tw/v1/tpex_main_daily_CLOSE');
                if (tpexRes2.ok) {
                    const tpexData2 = await tpexRes2.json();
                    tpexData2.forEach(item => {
                        const rawCode = item.SecuritiesCompanyCode || "";
                        const cleanCode = rawCode.trim().toUpperCase();
                        if (targetIds.includes(cleanCode)) {
                            const rawPrice = item.ClosePrice || "0";
                            globalPriceMap[cleanCode] = parseFloat(rawPrice.replace(/,/g, '')) || 0;
                        }
                    });
                }
            } catch (e) { console.warn("上櫃個股數據撈取有誤", e); }

            // 【4. 渲染畫面與計算市值】
            Object.keys(myStocks).forEach(originalCode => {
                const code = originalCode.trim().toUpperCase();
                const name = stockNames[code] || `個股 ${code}`;
                const price = globalPriceMap[code] || 0;
                const shares = myStocks[originalCode] || 0;
                const marketValue = price * shares;
                
                totalValue += marketValue;

                htmlContent += `
                    <tr>
                        <td><b>${code}</b></td>
                        <td>${name}</td>
                        <td class="text-right">${price > 0 ? '$' + price.toFixed(2) : '<span style="color:#ef4444;">未取得價格</span>'}</td>
                        <td class="text-right">${shares.toLocaleString()}</td>
                        <td class="text-right">${price > 0 ? '$' + marketValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : '-'}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlContent;
            document.getElementById('total-value').textContent = totalValue > 0 ? totalValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : "0";

        } catch (error) {
            console.error('全局錯誤:', error);
            tableBody.innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center; font-weight:bold;">⚠️ 數據解析失敗，請確認代碼格式。</td></tr>`;
        }
    }

    fetchStockData();
</script>

</body>
</html>
