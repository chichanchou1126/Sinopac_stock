<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 我的股票市值儀表板</h1>
    
    <div class="summary">
        總市值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th>股票名稱</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="5" class="loading">正在獲取即時股市資料...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================================
    // ⚙️ 【在此處修改你實際持有的台股代號與股數】
    // ==========================================================
    const myStocks = {
        "2330": 1000,  // 台積電 1000 股
        "2454": 500,   // 聯發科 500 股
        "0050": 2000   // 元大台灣50 2000 股
    };
    // ==========================================================

    async function fetchStockData() {
        const tableBody = document.getElementById('stock-table-body');
        try {
            // 改用無 CORS 限制的台灣個股盤後/即時資訊公開 API 來源
            const response = await fetch('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPriceTick&data_id=2330'); 
            // 備註：為了確保最高的穩定性與速度，此處採用一次性撈取當日全台股行情的免費管道
            const allPriceResponse = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX20');
            
            // 如果證交所官方阻擋，則自動切換至備用開放管道
            let stockList = [];
            if (allPriceResponse.ok) {
                stockList = await allPriceResponse.json();
            } else {
                // 備用無阻擋開放節點 (每日收盤行情)
                const backupRes = await fetch('https://raw.githubusercontent.com/Asoul/tsmc-stock/main/api/today.json').catch(() => null);
                if (backupRes && backupRes.ok) stockList = await backupRes.json();
            }

            if (!stockList || stockList.length === 0) {
                // 如果官方節點因盤後維護斷線，使用通用開放數據集
                const res = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL');
                stockList = await res.json();
            }

            let totalValue = 0;
            let htmlContent = '';
            const targetIds = Object.keys(myStocks);

            // 篩選出使用者設定的股票
            targetIds.forEach(code => {
                // 尋找對應代號的股票資料 (相容不同 API 的欄位名稱)
                const stockInfo = stockList.find(item => (item.Code || item.stock_id) === code);
                
                let name = "台灣個股";
                let price = 0;

                if (stockInfo) {
                    name = stockInfo.Name || stockInfo.stock_name || code;
                    // 取得價格 (轉換不同 API 的欄位：Price 或 ClosingPrice)
                    price = parseFloat(stockInfo.Price || stockInfo.ClosingPrice) || 0;
                } else {
                    // 若剛好遇到 API 盤後更新空檔，給予一個預估提示
                    name = `代號 ${code}`;
                }

                const shares = myStocks[code] || 0;
                const marketValue = price * shares;
                totalValue += marketValue;

                htmlContent += `
                    <tr>
                        <td><b>${code}</b></td>
                        <td>${name}</td>
                        <td class="text-right">$${price > 0 ? price.toFixed(2) : "更新中"}</td>
                        <td class="text-right">${shares.toLocaleString()}</td>
                        <td class="text-right">${marketValue > 0 ? '$' + marketValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : "計算中"}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlContent;
            document.getElementById('total-value').textContent = totalValue > 0 ? totalValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : "請重新整理";

        } catch (error) {
            console.error('詳細錯誤:', error);
            // 萬一因平日非交易時間或深夜維護導致全部失效，啟用終極靜態防護，避免畫面直接卡死
            fallbackLocalDisplay();
        }
    }

    // 終極防禦：若 API 全數斷線，改用替代穩定管道抓取
    async function fallbackLocalDisplay() {
        const tableBody = document.getElementById('stock-table-body');
        try {
            // 改呼叫民間無 CORS 阻擋的每日基本收盤行情
            const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL'));
            const json = await res.json();
            const stockList = JSON.parse(json.contents);
            
            let totalValue = 0;
            let htmlContent = '';
            
            Object.keys(myStocks).forEach(code => {
                const stockInfo = stockList.find(item => item.Code === code);
                const price = stockInfo ? (parseFloat(stockInfo.Price) || 0) : 0;
                const name = stockInfo ? stockInfo.Name : code;
                const shares = myStocks[code];
                const marketValue = price * shares;
                totalValue += marketValue;

                htmlContent += `
                    <tr>
                        <td><b>${code}</b></td>
                        <td>${name}</td>
                        <td class="text-right">$${price.toFixed(2)}</td>
                        <td class="text-right">${shares.toLocaleString()}</td>
                        <td class="text-right">$${marketValue.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
                    </tr>
                `;
            });
            tableBody.innerHTML = htmlContent;
            document.getElementById('total-value').textContent = totalValue.toLocaleString(undefined, {maximumFractionDigits: 0});
        } catch(e) {
            tableBody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">交易所伺服器維護中，請稍後再試。</td></tr>`;
        }
    }

    fetchStockData();
</script>

</body>
</html>
