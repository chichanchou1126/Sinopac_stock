<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 我的股票市值儀表板</h1>
    
    <div class="summary">
        總市值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th>股票名稱</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="5" class="loading">正在連線全球金融鏡像節點獲取即時收盤價...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================================
    // ⚙️ 【在此處修改你實際持有的台股代號與股數】
    // ⚠️ 備註：請一律在代號後面加上 .TW 
    // ==========================================================
    const myStocks = {
        "2330.TW": 1000,   // 台積電
        "2454.TW": 500,    // 聯發科
        "0050.TW": 2000,   // 元大台灣50
        "00751B.TW": 5000  // 元大公司債
    };
    // ==========================================================

    const stockNames = {
        "2330.TW": "台積電",
        "2454.TW": "聯發科",
        "0050.TW": "元大台灣50",
        "00751B.TW": "元大AAA至A級公司債"
    };

    async function fetchSingleStockPrice(symbol) {
        try {
            // Stooq 提供完全無 CORS 限制的歷史與即時收盤 CSV 數據下載 (極速且週末不關機)
            const res = await fetch(`https://stooq.com/q/l/?s=${symbol}&f=sd2t2ohlcv&h&e=csv`);
            if (!res.ok) return 0;
            
            const text = await res.text();
            const lines = text.split('\n');
            if (lines.length < 2) return 0;
            
            // CSV 第二行格式為: Symbol,Date,Time,Open,High,Low,Close,Volume
            const dataFields = lines[1].split(',');
            if (dataFields.length >= 7) {
                const closePrice = parseFloat(dataFields[6]); // 取得 Close 收盤價
                return isNaN(closePrice) ? 0 : closePrice;
            }
        } catch (e) {
            console.error(`${symbol} 讀取失敗`, e);
        }
        return 0;
    }

    async function fetchStockData() {
        const tableBody = document.getElementById('stock-table-body');
        let totalValue = 0;
        let htmlContent = '';
        
        const targetIds = Object.keys(myStocks);

        // 利用 Promise.all 讓所有股票的連線同時平行發出，確保 0.5 秒內完成
        const pricePromises = targetIds.map(symbol => fetchSingleStockPrice(symbol));
        const prices = await pricePromises;

        targetIds.forEach((symbol, index) => {
            const code = symbol.replace('.TW', '');
            const name = stockNames[symbol] || `個股 ${code}`;
            const price = prices[index];
            const shares = myStocks[symbol] || 0;
            const marketValue = price * shares;
            
            totalValue += marketValue;

            htmlContent += `
                <tr>
                    <td><b>${code}</b></td>
                    <td>${name}</td>
                    <td class="text-right">${price > 0 ? '$' + price.toFixed(2) : '<span style="color:#ef4444;">代號格式錯誤</span>'}</td>
                    <td class="text-right">${shares.toLocaleString()}</td>
                    <td class="text-right">${price > 0 ? '$' + marketValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : '-'}</td>
                </tr>
            `;
        });

            tableBody.innerHTML = htmlContent;
            document.getElementById('total-value').textContent = totalValue.toLocaleString(undefined, {maximumFractionDigits: 0});
    }

    fetchStockData();
</script>

</body>
</html>
