<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 我的股票市值儀表板</h1>
    
    <div class="summary">
        總市值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th>股票名稱</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="5" class="loading">正在連線 Yahoo Finance 獲取即時報價...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================================
    // ⚙️ 【在此處修改你實際持有的股票與股數】
    // ⚠️ 備註：台股上市請加 .TW，上櫃請加 .TWO (例如世界先進: 5347.TWO)
    // ==========================================================
    const myStocks = {
        "2330.TW": 1000,  // 台積電
        "2454.TW": 500,   // 聯發科
        "0050.TW": 2000   // 元大台灣50
    };
    // ==========================================================

    // 事先定義好中文名稱，避免 Yahoo API 撈到英文名稱
    const stockNames = {
        "2330.TW": "台積電",
        "2454.TW": "聯發科",
        "0050.TW": "元大台灣50"
    };

    async function fetchStockData() {
        const tableBody = document.getElementById('stock-table-body');
        let totalValue = 0;
        let htmlContent = '';
        const targetIds = Object.keys(myStocks);

        try {
            // 逐一呼叫 Yahoo Finance 的公開 Chart API (支援 CORS 且極度穩定)
            for (const symbol of targetIds) {
                try {
                    const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}`);
                    if (!res.ok) throw new Error(`無法讀取 ${symbol}`);
                    
                    const json = await res.json();
                    const meta = json.chart.result[0].meta;
                    
                    // 取得最新一筆即時股價
                    const price = meta.regularMarketPrice || 0;
                    const name = stockNames[symbol] || meta.symbol;
                    const shares = myStocks[symbol] || 0;
                    const marketValue = price * shares;
                    
                    totalValue += marketValue;

                    htmlContent += `
                        <tr>
                            <td><b>${symbol.replace('.TW', '')}</b></td>
                            <td>${name}</td>
                            <td class="text-right">$${price.toFixed(2)}</td>
                            <td class="text-right">${shares.toLocaleString()}</td>
                            <td class="text-right">$${marketValue.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
                        </tr>
                    `;
                } catch (singleError) {
                    console.error(`單檔股票 ${symbol} 讀取失敗:`, singleError);
                    htmlContent += `
                        <tr>
                            <td><b>${symbol}</b></td>
                            <td style="color:gray;">讀取失敗</td>
                            <td class="text-right">-</td>
                            <td class="text-right">${myStocks[symbol].toLocaleString()}</td>
                            <td class="text-right">-</td>
                        </tr>
                    `;
                }
            }

            tableBody.innerHTML = htmlContent;
            document.getElementById('total-value').textContent = totalValue.toLocaleString(undefined, {maximumFractionDigits: 0});

        } catch (error) {
            console.error('全局錯誤:', error);
            tableBody.innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center; font-weight:bold;">⚠️ 網路連線異常，請稍後再試。</td></tr>`;
        }
    }

    fetchStockData();
</script>

</body>
</html>
