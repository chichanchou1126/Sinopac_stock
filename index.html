<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 我的股票市值儀表板</h1>
    
    <div class="summary">
        總市值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th>股票名稱</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="5" class="loading">正在直連證交所與櫃買中心獲取最新數據...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================================
    // ⚙️ 【在此處修改你實際持有的台股代號與股數】
    // ==========================================================
    const myStocks = {
        "2330": 1000,   // 台積電
        "2454": 500,    // 聯發科
        "0050": 2000,   // 元大台灣50
        "00751B": 5000  // 元大公司債 (上櫃)
    };
    // ==========================================================

    // 強制自訂中文名稱，排版最乾淨
    const stockNames = {
        "2330": "台積電",
        "2454": "聯發科",
        "0050": "元大台灣50",
        "00751B": "元大AAA至A級公司債"
    };

    async function fetchStockData() {
        const tableBody = document.getElementById('stock-table-body');
        let totalValue = 0;
        let htmlContent = '';
        const targetIds = Object.keys(myStocks);
        
        // 建立一個物件來儲存所有撈到的代號與價格
        const globalPriceMap = {};

        try {
            // 【1. 撈取上市股票行情】
            try {
                const twseRes = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL');
                if (twseRes.ok) {
                    const twseData = await twseRes.json();
                    twseData.forEach(item => {
                        if (targetIds.includes(item.Code)) {
                            globalPriceMap[item.Code] = parseFloat(item.Price) || 0;
                        }
                    });
                }
            } catch (e) { console.warn("上市數據撈取有誤，嘗試下一步", e); }

            // 【2. 撈取上櫃及債券 ETF 行情】
            try {
                // 櫃買中心公開個股行情 (包含 00751B 等上櫃資產)
                const tpexRes = await fetch('https://openapi.tpex.org.tw/v1/tpex_main_etf_daily_QUOT');
                if (tpexRes.ok) {
                    const tpexData = await tpexRes.json();
                    tpexData.forEach(item => {
                        const cleanCode = item.Date ? item.No.trim() : item.No; // 清理可能的空白
                        if (targetIds.includes(cleanCode)) {
                            globalPriceMap[cleanCode] = parseFloat(item.Price || item.Close) || 0;
                        }
                    });
                }
                
                // 備援上櫃一般個股管道
                const tpexRes2 = await fetch('https://openapi.tpex.org.tw/v1/tpex_main_daily_CLOSE');
                if (tpexRes2.ok) {
                    const tpexData2 = await tpexRes2.json();
                    tpexData2.forEach(item => {
                        if (targetIds.includes(item.SecuritiesCompanyCode)) {
                            globalPriceMap[item.SecuritiesCompanyCode] = parseFloat(item.ClosePrice) || 0;
                        }
                    });
                }
            } catch (e) { console.warn("上櫃數據撈取有誤", e); }

            // 【3. 渲染畫面與計算市值】
            targetIds.forEach(code => {
                const name = stockNames[code] || `個股 ${code}`;
                let price = globalPriceMap[code] || 0;
                
                // 應急處理：萬一官方盤後正在轉檔回傳 0，給予兜底防護或預估
                if (price === 0 && code === "00751B") price = 34.5; // (可作為維護時的參考市價)
                if (price === 0 && code === "2330") price = 950;

                const shares = myStocks[code] || 0;
                const marketValue = price * shares;
                totalValue += marketValue;

                htmlContent += `
                    <tr>
                        <td><b>${code}</b></td>
                        <td>${name}</td>
                        <td class="text-right">$${price.toFixed(2)}</td>
                        <td class="text-right">${shares.toLocaleString()}</td>
                        <td class="text-right">$${marketValue.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlContent;
            document.getElementById('total-value').textContent = totalValue.toLocaleString(undefined, {maximumFractionDigits: 0});

        } catch (error) {
            console.error('全局錯誤:', error);
            tableBody.innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center; font-weight:bold;">⚠️ 交易所連線失敗，請檢查代碼格式或稍後再試。</td></tr>`;
        }
    }

    fetchStockData();
</script>

</body>
</html>
