<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 我的股票市值儀表板</h1>
    
    <div class="summary">
        總市值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th>股票名稱</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="5" class="loading">正在穿透網路阻擋，讀取即時報價中...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================================
    // ⚙️ 【在此處修改你實際持有的股票與股數】
    // ⚠️ 備註：台股上市請加 .TW，上櫃請加 .TWO (例如世界先進: 5347.TWO)
    // ==========================================================
    const myStocks = {
        "2330.TW": 1000,  // 台積電
        "2454.TW": 500,   // 聯發科
        "0050.TW": 2000   // 元大台灣50
    };
    // ==========================================================

    // 強制定義中文名稱，避開 API 抓不到名稱的防線
    const stockNames = {
        "2330.TW": "台積電",
        "2454.TW": "聯發科",
        "0050.TW": "元大台灣50"
    };

    async function getStockPrice(symbol) {
        // 嘗試方案 A：直接呼叫 Yahoo Finance (加上隨機參數避免快取攔截)
        try {
            const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?nocache=${Date.now()}`);
            if (res.ok) {
                const json = await res.json();
                return json.chart.result[0].meta.regularMarketPrice || 0;
            }
        } catch (e) {
            console.log(`方案 A 失敗，切換方案 B`);
        }

        // 嘗試方案 B：透過專門的免費反向代理，幫 GitHub 穿透 Yahoo 防火牆
        try {
            const targetUrl = encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}`);
            const res = await fetch(`https://api.allorigins.win/get?url=${targetUrl}`);
            if (res.ok) {
                const wrapper = await res.json();
                const json = JSON.parse(wrapper.contents);
                return json.chart.result[0].meta.regularMarketPrice || 0;
            }
        } catch (e) {
            console.log(`方案 B 失敗`);
        }
        
        return 0;
    }

    async function fetchStockData() {
        const tableBody = document.getElementById('stock-table-body');
        let totalValue = 0;
        let htmlContent = '';
        const targetIds = Object.keys(myStocks);

        for (const symbol of targetIds) {
            const price = await getStockPrice(symbol);
            const name = stockNames[symbol] || symbol.replace('.TW', '');
            const shares = myStocks[symbol] || 0;
            const marketValue = price * shares;
            
            totalValue += marketValue;

            htmlContent += `
                <tr>
                    <td><b>${symbol.replace('.TW', '').replace('.TWO', '')}</b></td>
                    <td>${name}</td>
                    <td class="text-right">${price > 0 ? '$' + price.toFixed(2) : '<span style="color:#f59e0b;">請稍後重整理</span>'}</td>
                    <td class="text-right">${shares.toLocaleString()}</td>
                    <td class="text-right">${price > 0 ? '$' + marketValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : '-'}</td>
                </tr>
            `;
        }

        tableBody.innerHTML = htmlContent;
        document.getElementById('total-value').textContent = totalValue > 0 ? totalValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : "載入中";
    }

    fetchStockData();
</script>

</body>
</html>
