<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 我的股票市值儀表板</h1>
    
    <div class="summary">
        總市值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th>股票名稱</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="5" class="loading">正在連線安全金融節點獲取報價...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================================
    // ⚙️ 【在此處修改你實際持有的台股代號與股數】
    // ==========================================================
    const myStocks = {
        "2330": 1000,  // 台積電 1000 股
        "2454": 500,   // 聯發科 500 股
        "0050": 2000   // 元大台灣50 2000 股
    };
    // ==========================================================

    const stockNames = {
        "2330": "台積電",
        "2454": "聯發科",
        "0050": "元大台灣50"
    };

    async function fetchStockData() {
        const tableBody = document.getElementById('stock-table-body');
        let totalValue = 0;
        let htmlContent = '';
        const targetIds = Object.keys(myStocks);

        try {
            // 使用完全允許網頁前端跨網域呼叫(CORS-enabled)的免費台股每日行情節點
            const response = await fetch('https://raw.githubusercontent.com/Asoul/tsmc-stock/main/api/today.json');
            if (!response.ok) throw new Error("主要節點載入失敗");
            
            const stockList = await response.json();

            targetIds.forEach(code => {
                // 尋找對應代號
                const stockInfo = stockList.find(item => item.Code === code || item.stock_id === code);
                
                const name = stockNames[code] || (stockInfo ? (stockInfo.Name || stockInfo.stock_name) : `個股 ${code}`);
                const price = stockInfo ? (parseFloat(stockInfo.Price || stockInfo.ClosingPrice) || 0) : 0;
                const shares = myStocks[code] || 0;
                const marketValue = price * shares;
                
                totalValue += marketValue;

                htmlContent += `
                    <tr>
                        <td><b>${code}</b></td>
                        <td>${name}</td>
                        <td class="text-right">$${price > 0 ? price.toFixed(2) : "未交易"}</td>
                        <td class="text-right">${shares.toLocaleString()}</td>
                        <td class="text-right">$${marketValue.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlContent;
            document.getElementById('total-value').textContent = totalValue.toLocaleString(undefined, {maximumFractionDigits: 0});

        } catch (error) {
            console.warn('切換至第二備用穩定節點...', error);
            
            // 萬一主要的靜態 GitHub 鏡像節點掛了，啟動備用 FinMind 財經開放管道
            try {
                let loadedCount = 0;
                tableBody.innerHTML = ''; 

                for (const code of targetIds) {
                    // 呼叫免簽名的個股即時資訊
                    const res = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPriceTick&data_id=${code}`);
                    const result = await res.json();
                    
                    let price = 0;
                    if (result.data && result.data.length > 0) {
                        // 取最新一筆成交價
                        price = result.data[result.data.length - 1].close || result.data[result.data.length - 1].price || 0;
                    }
                    
                    const name = stockNames[code] || `個股 ${code}`;
                    const shares = myStocks[code] || 0;
                    const marketValue = price * shares;
                    totalValue += marketValue;
                    loadedCount++;

                    tableBody.innerHTML += `
                        <tr>
                            <td><b>${code}</b></td>
                            <td>${name}</td>
                            <td class="text-right">$${price > 0 ? price.toFixed(2) : "盤後維護中"}</td>
                            <td class="text-right">${shares.toLocaleString()}</td>
                            <td class="text-right">$${marketValue.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
                        </tr>
                    `;
                }

                if(loadedCount > 0) {
                    document.getElementById('total-value').textContent = totalValue.toLocaleString(undefined, {maximumFractionDigits: 0});
                } else {
                    throw new Error("雙節點皆無回應");
                }

            } catch (fallbackError) {
                console.error('所有 API 均告失敗:', fallbackError);
                tableBody.innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center; font-weight:bold;">⚠️ 外部財經伺服器連線逾時，請確認網路連線或稍後再試。</td></tr>`;
            }
        }
    }

    fetchStockData();
</script>

</body>
</html>
