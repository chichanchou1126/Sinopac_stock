<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 我的股票市值儀表板</h1>
    
    <div class="summary">
        總市值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th>股票名稱</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="5" class="loading">正在透過安全代理穿透證交所防護牆...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================================
    // ⚙️ 【在此處修改你實際持有的台股代號與股數】
    // ==========================================================
    const myStocks = {
        "2330": 1000,   // 台積電
        "2454": 500,    // 聯發科
        "0050": 2000,   // 元大台灣50
        "00751B": 5000  // 元大公司債
    };
    // ==========================================================

    const stockNames = {
        "2330": "台積電",
        "2454": "聯發科",
        "0050": "元大台灣50",
        "00751B": "元大AAA至A級公司債"
    };

    async function fetchStockData() {
        const tableBody = document.getElementById('stock-table-body');
        let totalValue = 0;
        let htmlContent = '';
        
        const targetIds = Object.keys(myStocks).map(id => id.trim().toUpperCase());
        const globalPriceMap = {};

        // 建立 CORS 穿透代理網址
        const proxyUrl = "https://api.allorigins.win/get?url=";

        try {
            // 【1. 穿透抓取上市大盤收盤行情 (2330, 2454, 0050)】
            try {
                const target = encodeURIComponent('https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX20');
                const res = await fetch(`${proxyUrl}${target}`);
                if (res.ok) {
                    const wrapper = await res.json();
                    const twseData = JSON.parse(wrapper.contents);
                    
                    twseData.forEach(item => {
                        const code = (item.Code || item.StockId || "").trim().toUpperCase();
                        if (targetIds.includes(code)) {
                            const rawPrice = item.Price || item.ClosingPrice || "0";
                            globalPriceMap[code] = parseFloat(rawPrice.replace(/,/g, '')) || 0;
                        }
                    });
                }
            } catch (e) { console.error("代理抓取上市資料失敗", e); }

            // 【2. 穿透抓取上櫃與債券 ETF 收盤行情 (00751B)】
            try {
                const target = encodeURIComponent('https://openapi.tpex.org.tw/v1/tpex_main_daily_CLOSE');
                const res = await fetch(`${proxyUrl}${target}`);
                if (res.ok) {
                    const wrapper = await res.json();
                    const tpexData = JSON.parse(wrapper.contents);
                    
                    tpexData.forEach(item => {
                        const code = (item.SecuritiesCompanyCode || item.No || item.Code || "").trim().toUpperCase();
                        if (targetIds.includes(code)) {
                            const rawPrice = item.ClosePrice || item.Price || item.Close || "0";
                            globalPriceMap[code] = parseFloat(rawPrice.replace(/,/g, '')) || 0;
                        }
                    });
                }
            } catch (e) { console.error("代理抓取上櫃資料失敗", e); }

            // 【3. 輸出表格與計算市值】
            Object.keys(myStocks).forEach(originalCode => {
                const code = originalCode.trim().toUpperCase();
                const name = stockNames[code] || `個股 ${code}`;
                const price = globalPriceMap[code] || 0;
                const shares = myStocks[originalCode] || 0;
                const marketValue = price * shares;
                
                totalValue += marketValue;

                htmlContent += `
                    <tr>
                        <td><b>${code}</b></td>
                        <td>${name}</td>
                        <td class="text-right">${price > 0 ? '$' + price.toFixed(2) : '<span style="color:#f59e0b;">今日未交易或維護中</span>'}</td>
                        <td class="text-right">${shares.toLocaleString()}</td>
                        <td class="text-right">${price > 0 ? '$' + marketValue.toLocaleString(undefined, {maximumFractionDigits: 0}) : '-'}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlContent;
            document.getElementById('total-value').textContent = totalValue.toLocaleString(undefined, {maximumFractionDigits: 0});

        } catch (error) {
            console.error('全局錯誤:', error);
            tableBody.innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center; font-weight:bold;">⚠️ 代理伺服器繁忙，請重新整理網頁。</td></tr>`;
        }
    }

    fetchStockData();
</script>

</body>
</html>
