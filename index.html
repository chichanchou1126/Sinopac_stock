<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Finance 股票市值儀表板</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fb; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .summary { background: #e0f2fe; padding: 20px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #0369a1; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .text-right { text-align: right; }
        .loading { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Google Finance 雲端市值儀表板</h1>
    
    <div class="summary">
        總資產價值：NT$ <span id="total-value">計算中...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代號</th>
                <th class="text-right">目前股價</th>
                <th class="text-right">持有股數</th>
                <th class="text-right">當前市值</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="4" class="loading">正在連線 Google Sheets 獲取最新報價...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // =============================================================
    // ⚠️ 請在下方雙引號內貼上你從 Google 試算表發布的 CSV 網址
    // =============================================================
    const csvUrl = "YOUR_CSV_URL_HERE"; 
    // =============================================================

    async function fetchGoogleSheetData() {
        const tableBody = document.getElementById('stock-table-body');
        try {
            if (csvUrl.includes("YOUR_CSV_URL_HERE")) {
                throw new Error("您尚未修改程式碼中的 csvUrl 網址！");
            }

            const response = await fetch(csvUrl);
            if (!response.ok) throw new Error("網頁無法載入 Google 試算表，請確認試算表已成功發布。");
            
            const csvText = await response.text();
            
            // 相容各種作業系統的換行符號（\r\n 或 \n）
            const lines = csvText.split(/\r?\n/);
            
            let totalValue = 0;
            let hasValidRow = false;
            let htmlContent = '';

            // 從第二行開始讀取資料 (跳過第一行的標題 Symbol, Price, Shares)
            for(let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue; // 略過空白行

                // 使用逗號切開欄位
                const row = line.split(',');
                if (row.length < 3 || !row[0]) continue;

                // 清理資料中可能夾帶的雙引號
                const symbol = row[0].replace(/"/g, '').trim();
                const price = parseFloat(row[1].replace(/"/g, '')) || 0;
                const shares = parseFloat(row[2].replace(/"/g, '')) || 0;
                const marketValue = price * shares;
                
                totalValue += marketValue;
                hasValidRow = true;

                htmlContent += `
                    <tr>
                        <td><b>${symbol}</b></td>
                        <td class="text-right">$${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td class="text-right">${shares.toLocaleString()}</td>
                        <td class="text-right">$${marketValue.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
                    </tr>
                `;
            }

            if (!hasValidRow) {
                throw new Error("試算表中沒有有效的股票資料，請檢查試算表的內容格式。");
            }

            tableBody.innerHTML = htmlContent;
            document.getElementById('total-value').textContent = totalValue.toLocaleString(undefined, {maximumFractionDigits: 0});

        } catch (error) {
            console.error('詳細錯誤訊息:', error);
            tableBody.innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">錯誤：${error.message}<br><small style="color:#999;">請按 F12 開啟 Console 查看詳細日誌</small></td></tr>`;
        }
    }

    fetchGoogleSheetData();
</script>

</body>
</html>
